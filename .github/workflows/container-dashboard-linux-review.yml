name: Isolated container dashboard Linux review
on:
  push:
    branches: [ci/container-dashboard-linux-review]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Original upstream main
            ref: 81fa17f0f8f9dd0110cba2602715a1256a212fee
          - name: Cleaned container dashboard proposal
            ref: 1dda8e6434d2791ca29f8ba3c0d634286fd09b3b
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - name: Diagnose isolated demo discovery
        run: |
          python - <<'PYCODE'
          import asyncio, time
          from fleetdeck.providers.demo import DemoProvider
          from fleetdeck.app import create_app
          from fleetdeck.config import AppConfig
          from fastapi.testclient import TestClient
          print("monotonic", time.monotonic())
          try:
              print("direct demo targets", len(asyncio.run(DemoProvider().discover())))
          except Exception as error:
              print("direct demo error", type(error).__name__, str(error))
          with TestClient(create_app(AppConfig(demo=True))) as client:
              data = client.get("/api/targets").json()
              print("API targets", len(data.get("targets", [])), "errors", data.get("errors"))
          PYCODE
      - run: python -m pytest -q -ra
